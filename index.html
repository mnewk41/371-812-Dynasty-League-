<style>
:root{--bg:#f6f4ee;--fg:#14231a;--card:#fff;--accent:#1f7a3d;--muted:#5b6b60;--line:#dcd8cb}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a12;--fg:#eef3ec;--card:#16261b;--accent:#4cc27a;--muted:#9bb0a1;--line:#243a2b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.ticker{position:sticky;top:0;z-index:10;display:flex;background:#0b1f13;color:#eef3ec;border-bottom:2px solid var(--accent);font:600 14px system-ui,sans-serif}
.lbl{flex:none;background:var(--accent);color:#fff;padding:10px 14px;font-size:12px;display:flex;align-items:center}
.tw{overflow:hidden;flex:1}.track{display:flex;width:max-content;animation:tick 60s linear infinite}.track:hover{animation-play-state:paused}.set{display:flex}
.item{padding:10px 24px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.15)}.item.live{color:#ff6b6b}
@keyframes tick{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.track{animation:none}.tw{overflow-x:auto}}
header{background:#000;padding:26px 20px 20px;text-align:center;border-bottom:4px solid var(--accent)}
.logo{display:block;width:min(270px,72vw);height:auto;margin:0 auto 6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1{font-size:clamp(2.2rem,7vw,3.8rem);margin:0 0 8px;line-height:1.05}
header p{color:#9bb0a1;margin:0;font:14px system-ui,sans-serif}
.tabs{display:flex;gap:8px;overflow-x:auto;max-width:1000px;margin:0 auto;padding:16px 20px;border-bottom:1px solid var(--line)}
.tabs button,.bub{flex:none;font:600 14px system-ui,sans-serif;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.tabs button[aria-selected=true],.bub[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:28px 20px 60px;min-height:60vh}
h2{margin:0 0 14px;font-size:1.6rem}
.sub,.msg{color:var(--muted);font:14px system-ui,sans-serif}
.bubs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
select{font:600 14px system-ui,sans-serif;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);margin-bottom:14px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font:15px system-ui,sans-serif}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-size:12px;text-transform:uppercase}
.mus{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:30px}
.mu,.tx{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-family:system-ui,sans-serif}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0}.row+.row{border-top:1px solid var(--line)}
.rec{color:var(--muted);font-size:13px;margin-left:4px}
.rafters{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;border-top:6px solid var(--line);padding-top:14px}
.banner{width:140px;background:var(--accent);color:#fff;text-align:center;padding:26px 12px 44px;font-family:system-ui,sans-serif;clip-path:polygon(0 0,100% 0,100% 88%,50% 100%,0 88%);margin-top:-14px;transform-origin:50% 0;animation:sway 4.5s ease-in-out infinite alternate}
.banner:nth-child(even){animation-duration:5.4s;animation-delay:-2s}
.banner .yr{font:700 2rem/1 Georgia,serif;display:block;margin:8px 0 10px}.banner b{display:block;font-size:.95rem}.banner small{opacity:.85}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@media(prefers-reduced-motion:reduce){.banner{animation:none}}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;font-family:system-ui,sans-serif;margin-bottom:26px}
@media(max-width:720px){.board{min-width:720px}}
.bh{padding:4px 2px;text-align:center;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:700}
.pk{position:relative;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:6px;padding:12px 3px 5px;text-align:center;min-height:96px}
.pk i{position:absolute;top:2px;left:4px;font-style:normal;font-size:9px;color:var(--muted)}
.pk img{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--c);display:block;margin:2px auto 4px}
.pk strong{display:block;font-size:10.5px;line-height:1.2;overflow-wrap:anywhere}
.pk .pm{display:block;font-size:9.5px;color:var(--c);font-weight:600}.pk em{display:block;font-style:normal;font-size:9px;color:var(--muted)}
.tx img{width:28px;height:28px;border-radius:50%;vertical-align:middle;margin-right:6px;background:var(--line)}
.add{color:var(--accent)}.drop{color:#c0392b}
.accs{border-bottom:1px solid var(--line)}
.acc{border-top:1px solid var(--line)}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;background:none;border:0;color:var(--fg);font:600 1.1rem Georgia,serif;padding:16px 4px;cursor:pointer}
.acc>button:after{content:'+';color:var(--accent);font-size:1.4rem}
.acc>button[aria-expanded=true]:after{content:'\2013'}
.accb{padding:0 4px 18px;font:15px/1.55 system-ui,sans-serif;max-width:760px}
.accb[hidden]{display:none}
.accb h4{margin:18px 0 4px;font:700 15px system-ui,sans-serif;color:var(--accent)}
.accb p,.accb ul{margin:6px 0}
.mcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.mc{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-family:system-ui,sans-serif}
.mc b{font:700 1.1rem Georgia,serif}
.mc .sub{margin:2px 0}
.mc .note{margin:8px 0 0;font-size:14px}
.av2{position:relative;flex:none;width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden}
.av2 img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.odd{display:flex;align-items:center;gap:10px;margin:7px 0;font:14px system-ui,sans-serif}
.odd .nm{width:190px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.odd .bar{flex:1;height:18px;background:var(--line);border-radius:6px;overflow:hidden}
.odd .bar i{display:block;height:100%;background:var(--accent)}
.odd .pc{width:44px;text-align:right;font-weight:700}
@media(max-width:600px){.odd .nm{width:120px}}
.pboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:14px 0 22px;font-family:system-ui,sans-serif}
.pcard{position:relative;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:8px;padding:18px 8px 10px;text-align:center}
.pcard i{position:absolute;top:4px;left:8px;font-style:normal;font-size:11px;color:var(--muted)}
.pcard b{display:block;font-size:13px;line-height:1.25}
.pcard span{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.pg{font-size:13px}.pg th,.pg td{text-align:center;padding:7px 4px}.pg td:first-child,.pg th:first-child{text-align:left;padding-left:8px}
.mut{color:var(--muted)}
.pcard em{display:block;font-style:normal;font-size:10.5px;color:var(--accent);margin-top:3px;font-weight:600}
.mu.click{cursor:pointer}.mu.click:hover{border-color:var(--accent)}
.mo{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.mp{position:relative;background:var(--bg);color:var(--fg);border-radius:14px;max-width:960px;width:100%;padding:22px 18px 26px;font-family:system-ui,sans-serif}
.mx{position:absolute;top:8px;right:12px;background:none;border:0;color:var(--fg);font-size:28px;cursor:pointer;line-height:1}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.ms{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid var(--accent);padding-bottom:8px}
.mh .sub{margin:2px 0 0}.tot{font:700 1.9rem Georgia,serif;color:var(--accent)}
.ms h4{margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pr{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.pr .sl{flex:none;width:34px;font-size:11px;font-weight:700;color:var(--muted)}
.pr img{flex:none;width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--line)}
.pr .pn{flex:1;min-width:0;line-height:1.2}.pr .pn small{display:block;color:var(--muted);font-size:11px}
.pr .pt{flex:none;font-weight:700}
.tl{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin:0 5px 2px 0}
.item .tl:not(:first-child){margin-left:4px}
.cm{display:inline-block;font:700 10px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;background:var(--accent);color:#fff;padding:2px 7px;border-radius:999px;vertical-align:middle;margin-left:4px}
.mc.click{cursor:pointer}.mc.click:hover{border-color:var(--accent)}
.ph{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.av2.big{width:76px;height:76px;font-size:26px}
.ph4{margin:18px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:6px 0 10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.tile b{display:block;font:700 1.35rem Georgia,serif;color:var(--accent)}.tile span{font-size:12px;color:var(--muted)}
.pphoto{flex:none;width:150px;height:200px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
@media(max-width:520px){.pphoto{width:120px;height:160px}}
</style>
</head>

"p:All trades that are found guilty of collusion, will be reversed/denied. If the trade had affected the outcome of previous games, the results of those games will be revised.",

"p:The commissioner will err on the side of letting owners manage their teams the way they see fit. Any collusion will need to be clear. The commissioner reserves the right to step in and at the very least assess the thinking of any team involved in a heavily lop-sided trade.",

"p:Any player traded from a team may not be re-acquired via trade within 6 weeks of the original trade. Any teams involved in this behavior will be subject to the aforementioned collusion punishments.",

"p:The trade deadline will be set for the Saturday of the week 11 games of the NFL season.",
"h:1.2.4 Trade Restrictions",
"p:You will not be able to trade draft picks that are more than 3 drafts away. For example, during the 2024 season you cannot trade any picks in or after the 2028 draft. You may only trade FAAB $ from the current season.",

"p:A total of 5 veto votes are required to veto a trade. Those who are trading votes do not count towards a veto. Vetoes are only appropriate in instances of collusion or an egregious mismatch of value (i.e., CMC for a backup kicker). Not liking a trade does not warrant a veto.",

/* ================================== */
const API = 'https://api.sleeper.app/v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get = async p => { const r = await fetch(API + p); if (!r.ok) throw new Error(p + ' ' + r.status); return r.json(); };
const COL = {QB:'#ff2a6d',RB:'#00ceb8',WR:'#58a7ff',TE:'#ffae58',K:'#b266ff',DEF:'#c08a4a'};
const photo = id => /^\d+$/.test(id) ? `https://sleepercdn.com/content/nfl/players/thumb/${id}.jpg` : `https://sleepercdn.com/images/team_logos/nfl/${String(id).toLowerCase()}.png`;
const rec = r => `${r.settings.wins}-${r.settings.losses}`;
const pts = r => r.settings.fpts + (r.settings.fpts_decimal || 0) / 100;
let S = [], PL = null, RECS = null;

async function init() {
  let id = LEAGUE_ID;
  while (id && id !== '0') {
    const [lg, us, ro] = await Promise.all([get('/league/' + id), get(`/league/${id}/users`), get(`/league/${id}/rosters`)]);
    const names = {}, mgr = {}, rname = {}, rown = {};
    us.forEach(u => { names[u.user_id] = u.metadata?.team_name || 'Team ' + realName(u.display_name); mgr[u.user_id] = realName(u.display_name); });
    us.forEach(u => { if (ALIASES[u.display_name]) names[u.user_id] = 'Team ' + realName(u.display_name); });
    Object.entries(KNOWN_IDS).forEach(([uid, un]) => { mgr[uid] = realName(un); names[uid] = 'Team ' + realName(un); });
    ro.forEach(r => { if (!r.owner_id && FORMER_ROSTERS[id + ':' + r.roster_id]) r.owner_id = FORMER_ROSTERS[id + ':' + r.roster_id]; });
    ro.forEach(r => { rname[r.roster_id] = names[r.owner_id] || 'Roster ' + r.roster_id; rown[r.roster_id] = r.owner_id; });
    let champ = null, ru = null, wb = [];
    try { wb = await get(`/league/${id}/winners_bracket`); const f = wb.find(m => m.p === 1); if (f && lg.status === 'complete') { champ = f.w; ru = f.w === f.t1 ? f.t2 : f.t1; } } catch (e) {}
    S.push({id, lg, us, ro, names, mgr, rname, rown, champ, ru, wb, season: lg.season});
    id = lg.previous_league_id;
  }
  $('#ttl').textContent = S[0].lg.name.trim();
  $('#tag').textContent = `Dynasty · ${S[0].lg.total_rosters} teams · ${S[0].season} season`;
  go();
}

/* ---------- views ---------- */
const views = {
  async matchups(w) {
    const s = S[0], cur = s.lg.settings.leg || 1; w = w || cur;
    const m = await get(`/league/${s.id}/matchups/${w}`), g = {};
    m.forEach(x => (g[x.matchup_id] ??= []).push(x));
    const rr = Object.fromEntries(s.ro.map(r => [r.roster_id, r]));
    const cards = Object.entries(g).map(([mid, p]) => `<div class="mu click" tabindex="0" role="button" onclick="openMu(${w},${mid})" onkeydown="if(event.key==='Enter')openMu(${w},${mid})">${p.map(x => `<div class="row"><span>${esc(s.rname[x.roster_id])} <span class="rec">${rec(rr[x.roster_id])}</span></span><b>${(x.points || 0).toFixed(2)}</b></div>`).join('')}</div>`).join('');
    setTimeout(oddsFill, 0);
    const hasMed = !!s.lg.settings.league_average_match, H = h2hOf(await seasonPairs(s));
    const split = r => { const h = H[r.roster_id] || {w: 0, l: 0, t: 0}; return `<td>${h.w}-${h.l}${h.t ? '-' + h.t : ''}</td><td>${Math.max(0, r.settings.wins - h.w)}-${Math.max(0, r.settings.losses - h.l)}</td>`; };
    const st = [...s.ro].sort((a, b) => b.settings.wins - a.settings.wins || pts(b) - pts(a));
    const cut = s.lg.settings.playoff_teams || 6;
    return `<h2>Matchups</h2>${weekSel(w, 'matchups')}<p class="sub">Tap a matchup to see both rosters and live scoring.</p><div class="mus">${cards || '<p class="msg">No matchups for this week yet.</p>'}</div>
    <h2>Playoff odds</h2><div id="odds"><p class="msg">Running the numbers…</p></div>
    <h2>Standings</h2><p class="sub">Top ${cut} make the playoffs. Ties broken by points scored.</p><div class="scroll"><table><tr><th>#</th><th>Team</th><th>Manager</th><th>W-L</th>${hasMed ? '<th>Head-to-head</th><th>Median</th>' : ''}<th>PF</th></tr>
    ${st.map((r, i) => `<tr${i < cut ? ' style="border-left:3px solid var(--accent)"' : ''}><td>${i + 1}</td><td>${esc(s.rname[r.roster_id])}</td><td>${esc(s.mgr[r.owner_id])}</td><td>${rec(r)}</td>${hasMed ? split(r) : ''}<td>${pts(r).toFixed(2)}</td></tr>`).join('')}</table></div>${hasMed ? '<p class="sub" style="margin-top:10px">W-L is the record Sleeper uses for the playoffs, which also counts a win or loss against the league median each week. Head-to-head and Median split it into real matchups and median results.</p>' : ''}`;
  },
  async trades(w) {
    const s = S[0]; w = w || s.lg.settings.leg || 1;
    const [tx] = await Promise.all([get(`/league/${s.id}/transactions/${w}`), PL ? 0 : get('/players/nfl').then(p => PL = p)]);
    const nm = id => PL[id] ? (PL[id].full_name || PL[id].last_name || PL[id].player_id) : id;
    const pl = (id, c, sign) => `<div class="${c}"><img src="${photo(id)}" alt="" onerror="this.style.visibility='hidden'">${sign} ${esc(nm(id))}</div>`;
    const items = tx.filter(t => t.status === 'complete').sort((a, b) => b.created - a.created).map(t => {
      const teams = t.roster_ids.map(r => esc(s.rname[r])).join(' ↔ ');
      const adds = Object.entries(t.adds || {}).map(([p, r]) => pl(p, 'add', '+') ).join('');
      const drops = Object.entries(t.drops || {}).map(([p]) => pl(p, 'drop', '−')).join('');
      const kind = t.type === 'trade' ? 'Trade' : t.type === 'waiver' ? 'Waiver claim' : 'Free agent';
      return `<div class="tx"><div class="sub"><b>${kind}</b> · ${teams} · ${new Date(t.created).toLocaleDateString()}</div>${adds}${drops}</div>`;
    }).join('<div style="height:10px"></div>');
    return `<h2>Trades and Waivers</h2>${weekSel(w, 'trades')}${items || '<p class="msg">No moves this week.</p>'}`;
  },
  async managers() {
    const cur = S[0], T = {}, A = {};
    const find = id => { for (const x of S) { const u = x.us.find(u => u.user_id === id); if (u) return u; } };
    const key = id => { const u = find(id), dn = u && (ALIASES[u.display_name] || u.display_name); return dn && MANAGERS[dn] ? MANAGERS[dn].name : (KNOWN_IDS[id] ? realName(KNOWN_IDS[id]) : id); };
    S.forEach(x => {
      x.ro.forEach(r => { if (!r.owner_id) return; const a = A[key(r.owner_id)] ??= {n: 0, w: 0, l: 0, first: 9999, last: 0}; a.n++; a.w += r.settings.wins; a.l += r.settings.losses; a.first = Math.min(a.first, +x.season); a.last = Math.max(a.last, +x.season); });
      if (x.champ && x.rown[x.champ]) (T[key(x.rown[x.champ])] ??= []).push(x.season);
    });
    const cl = cur.ro.map(r => {
      const u = find(r.owner_id), d = u.display_name, m = MANAGERS[d] || {}, k = key(r.owner_id), a = A[k], t = (T[k] || []).sort();
      const isC = COMMISSIONERS.includes(d) || !!u.is_owner, nm = m.name || d, ini = nm.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
      return {nm, c: isC, html: `<div class="mc click" tabindex="0" role="button" data-m="${esc(nm)}" onclick="openMgr(this.dataset.m)" onkeydown="if(event.key==='Enter')openMgr(this.dataset.m)"><div class="av2">${esc(ini)}${PHOTOS[nm] ? `<img src="${PHOTOS[nm].t}" alt="">` : u.avatar ? `<img src="https://sleepercdn.com/avatars/thumbs/${esc(u.avatar)}" alt="" onerror="this.remove()">` : ''}</div>
      <div><b>${esc(nm)}</b>${isC ? ' <span class="cm">Commissioner</span>' : ''}<div class="sub">${esc(cur.rname[r.roster_id])}</div><div class="sub">Sleeper: ${esc(d)}</div>
      <div class="sub">In the league since ${a.first} · ${a.n} season${a.n > 1 ? 's' : ''}</div><div class="sub">All-time record: ${a.w}-${a.l}</div>
      <div class="sub">Titles: ${t.length ? t.length + ' (' + t.join(', ') + ')' : 'none yet'}</div>${m.note ? `<p class="note">${esc(m.note)}</p>` : ''}</div></div>`};
    }).sort((x, y) => x.nm.localeCompare(y.nm));
    const cards = cl.map(x => x.html).join(''), comm = cl.filter(x => x.c).map(x => x.nm);
    const R = {};
    await Promise.all(S.map(async x => (await seasonPairs(x)).forEach(p => {
      const a = x.mgr[x.rown[p.a.roster_id]], b = x.mgr[x.rown[p.b.roster_id]], RA = R[a] ??= {w: 0, l: 0, t: 0}, RB = R[b] ??= {w: 0, l: 0, t: 0};
      if (p.tie) { RA.t++; RB.t++; } else { RA.w++; RB.l++; }
    })));
    const now = new Set(cur.ro.map(r => key(r.owner_id)));
    const past = Object.keys(A).filter(k => !now.has(k)).map(k => { const a = A[k], t = (T[k] || []).sort();
      return `<tr><td>${esc(find(k) ? realName(find(k).display_name) : k)}</td><td>${a.first === a.last ? a.first : a.first + '–' + a.last}</td><td>${R[k] ? R[k].w + '-' + R[k].l + (R[k].t ? '-' + R[k].t : '') : '–'}</td><td>${t.length ? t.join(', ') : '–'}</td></tr>`; }).join('');
    return `<h2>Managers</h2><p class="sub">Everyone in the league, who they are, and how they've done. Tap a manager to see their full profile.</p>${comm.length ? `<p><b>Commissioner${comm.length > 1 ? 's' : ''}:</b> ${esc(comm.join(', '))}</p>` : ''}<div class="mcs">${cards}</div>
    ${past ? `<h2 style="margin-top:34px">Retired managers</h2><p class="sub">All-time record counts regular-season head-to-head games only.</p><div class="scroll"><table><tr><th>Manager</th><th>Seasons</th><th>All-time record</th><th>Titles</th></tr>${past}</table></div>` : ''}`;
  },
  async drafts(yr) {
    yr = yr || S[0].season;
    const s = S.find(x => x.season === yr) || S[0];
    const NEXT = String(+S[0].season + 1);
    const bubs = `<div class="bubs">${[NEXT, ...S.map(x => x.season)].map(y => `<button class="bub" aria-pressed="${y === (yr === NEXT ? NEXT : s.season)}" onclick="view('drafts','${y}')">${y}${y === NEXT ? ' (projected)' : ''}</button>`).join('')}</div>`;
    if (yr === NEXT) { setTimeout(projFill, 0); return `<h2>Drafts</h2>${bubs}<div id="proj"><p class="msg">Running the numbers…</p></div>`; }
    const ds = (await get(`/league/${s.id}/drafts`)).filter(d => d.status === 'complete').sort((a, b) => a.start_time - b.start_time);
    let out = '';
    for (const d of ds) {
      const picks = await get(`/draft/${d.draft_id}/picks`);
      if (!picks.length) continue;
      const T = d.settings.teams, R = d.settings.rounds, slotUser = {};
      Object.entries(d.draft_order || {}).forEach(([u, sl]) => slotUser[sl] = u);
      const cell = {}; picks.forEach(p => cell[p.round + '-' + p.draft_slot] = p);
      for (let sl = 1; sl <= T; sl++) if (!slotUser[sl] && cell['1-' + sl]) slotUser[sl] = cell['1-' + sl].picked_by;
      let b = `<div class="scroll"><div class="board" style="grid-template-columns:repeat(${T},minmax(0,1fr))">`;
      for (let sl = 1; sl <= T; sl++) b += `<div class="bh">${esc(s.names[slotUser[sl]] || s.mgr[slotUser[sl]] || 'Slot ' + sl)}</div>`;
      for (let r = 1; r <= R; r++) for (let sl = 1; sl <= T; sl++) {
        const p = cell[r + '-' + sl]; if (!p) { b += '<div></div>'; continue; }
        const m = p.metadata || {}, pos = m.position || 'WR', c = COL[pos] || '#888';
        const nmx = pos === 'DEF' ? (m.first_name + ' D/ST') : (m.first_name || '?')[0] + '. ' + (m.last_name || '');
        const via = p.picked_by && slotUser[sl] && p.picked_by !== slotUser[sl] ? `<em>via ${esc(s.names[p.picked_by] || s.mgr[p.picked_by] || '')}</em>` : '';
        b += `<div class="pk" style="--c:${c}"><i>${r}.${String(p.pick_no - (r - 1) * T).padStart(2, '0')}</i><img src="${photo(p.player_id)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><strong>${esc(nmx)}</strong><span class="pm">${esc(pos)} · ${esc(m.team || 'FA')}</span>${via}</div>`;
      }

    return `<h2>Drafts</h2>${bubs}${out || '<p class="msg">No draft results recorded for this season.</p>'}`;
  },
  async trophy() {
    const b = S.filter(x => x.champ).map(x => `<div class="banner"><span>★</span><span class="yr">${x.season}</span><b>${esc(x.rname[x.champ])}</b><small>${esc(x.mgr[x.rown[x.champ]])}</small></div>`).join('');
    return `<h2>Trophy Room</h2><div class="rafters">${b || '<p class="msg">No champions yet.</p>'}</div>`;
  },
  async records() {
    if (RECS) return RECS;
    const tw = [], mu = [], seasons = [], M = {};
    const mg = n => M[n] ??= {n, ss: new Set(), w: 0, l: 0, t: 0, pf: 0, pa: 0, mw: 0, ml: 0, ti: 0};
    await Promise.all(S.map(async s => {
      const prs = await seasonPairs(s), nm = rid => s.mgr[s.rown[rid]] || 'Unknown', hm = !!s.lg.settings.league_average_match, H = h2hOf(prs);
      if (s.lg.status === 'complete') s.ro.forEach(r => seasons.push({s, rid: r.roster_id, v: pts(r)}));
      s.ro.forEach(r => { const m = mg(nm(r.roster_id)); m.ss.add(s.season); const h = H[r.roster_id] || {w: 0, l: 0};
        if (hm) { m.mw += Math.max(0, r.settings.wins - h.w); m.ml += Math.max(0, r.settings.losses - h.l); } });
      if (s.champ) mg(nm(s.champ)).ti++;
      prs.forEach(p => {
        [p.a, p.b].forEach(x => tw.push({s, week: p.week, rid: x.roster_id, v: x.points}));
        const A = mg(nm(p.a.roster_id)), B = mg(nm(p.b.roster_id));
        A.pf += p.a.points; A.pa += p.b.points; B.pf += p.b.points; B.pa += p.a.points;
        if (p.tie) { A.t++; B.t++; } else { A.w++; B.l++; mu.push({s, week: p.week, w: p.a, l: p.b, m: p.a.points - p.b.points}); }
      });
    }));
    const who = (s, rid) => `<td>${esc(s.mgr[s.rown[rid]] || 'Unknown')}</td><td>${esc(s.rname[rid])}</td>`;
    const f = v => Number(v).toFixed(2), top = (a, fn, n = 10) => [...a].sort(fn).slice(0, n);
    const tbl = (title, heads, rows) => `<h3 class="rd">${title}</h3><div class="scroll"><table><tr><th>#</th>${heads.map(h => `<th>${h}</th>`).join('')}</tr>${rows.map((r, i) => `<tr><td>${i + 1}</td>${r}</tr>`).join('')}</table></div>`;
    const wk = r => `<td>${r.s.season} · Week ${r.week}</td>`;
    const teamHeads = ['Manager', 'Team', 'When', 'Points'];
    const mHeads = ['Winner', 'Score', 'Loser', 'Score', 'Margin', 'When'];
    const mRow = r => `<td>${esc(r.s.mgr[r.s.rown[r.w.roster_id]] || '?')}<br><small class="sub">${esc(r.s.rname[r.w.roster_id])}</small></td><td><b>${f(r.w.points)}</b></td><td>${esc(r.s.mgr[r.s.rown[r.l.roster_id]] || '?')}<br><small class="sub">${esc(r.s.rname[r.l.roster_id])}</small></td><td>${f(r.l.points)}</td><td><b>${f(r.m)}</b></td><td>${r.s.season} · Week ${r.week}</td>`;
    const pct = m => (m.w + m.t / 2) / ((m.w + m.l + m.t) || 1);
    const cur = new Set(S[0].ro.map(r => S[0].mgr[r.owner_id]));
    const all = Object.values(M).filter(m => cur.has(m.n) && m.w + m.l + m.t > 0).sort((a, b) => pct(b) - pct(a) || b.pf - a.pf);
    const standings = tbl('All-time standings', ['Manager', 'Seasons', 'Record', 'Win %', 'Points for', 'Points against', 'Titles'],
      all.map(m => `<td>${esc(m.n)}</td><td>${m.ss.size}</td><td><b>${m.w}-${m.l}${m.t ? '-' + m.t : ''}</b></td><td>${(pct(m) * 100).toFixed(1)}%</td><td>${Math.round(m.pf).toLocaleString()}</td><td>${Math.round(m.pa).toLocaleString()}</td><td>${m.ti || '–'}</td>`));

      <h4 class="ph4">Career</h4><div class="tiles">${tile('Seasons', M.rows.length)}${tile('Record', `${tot.w}-${tot.l}${tot.t ? '-' + tot.t : ''}`)}${tile('Win %', pct.toFixed(1) + '%')}${tile('Titles', titles.length)}${tile('Playoff trips', po)}${tile('Avg points', g ? f(tot.pf / g) : '–')}</div>
      <p class="sub">${titles.length ? '🏆 Champion: ' + titles.join(', ') : 'No championships yet'}${ru.length ? ' · Runner-up: ' + ru.join(', ') : ''}</p>
      <h4 class="ph4">Career highs</h4>${M.bw ? `<div>Highest score: <b>${f(M.bw.v)}</b> (${M.bw.season}, Week ${M.bw.week})</div>` : ''}${M.bm ? `<div>Biggest win: <b>${f(M.bm.v)}</b> points over ${esc(M.bm.opp)} (${M.bm.season}, Week ${M.bm.week})</div>` : ''}
      <h4 class="ph4">Season by season</h4><div class="scroll"><table><tr><th>Season</th><th>Team</th><th>Record</th><th>Points</th><th>Finish</th><th>Result</th></tr>
      ${M.rows.map(x => `<tr><td>${x.season}</td><td>${esc(x.team)}</td><td>${x.w}-${x.l}${x.t ? '-' + x.t : ''}</td><td>${Math.round(x.pf).toLocaleString()}</td><td>${x.done ? ord(x.rank) : 'in progress'}</td><td>${x.champ ? '🏆 Champion' : x.ru ? 'Runner-up' : x.po ? 'Made playoffs' : x.done ? '–' : ''}</td></tr>`).join('')}</table></div>
      <p class="sub" style="margin-top:10px">Records count regular-season head-to-head games only. Finish is the regular-season standing.</p>`;
  } catch (e) { body.innerHTML = `<p class="msg">Couldn't load this profile (${esc(e.message)}).</p>`; }
}
const TABS = [['matchups','Matchups'],['trades','Trades and Waivers'],['managers','Managers'],['drafts','Drafts'],['trophy','Trophy Room'],['records','Records'],['constitution','Constitution']];
function acc(b){const o=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!o));b.nextElementSibling.hidden=o;}
function weekSel(w, v) {
  return `<select onchange="view('${v}',this.value)">${Array.from({length: 18}, (_, i) => `<option value="${i + 1}"${i + 1 == w ? ' selected' : ''}>Week ${i + 1}</option>`).join('')}</select>`;
}
async function view(name, arg) {
  $('#tabs').querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.t === name));
  $('#main').innerHTML = '<p class="msg">Loading…</p>';
  try { $('#main').innerHTML = await views[name](arg); }
  catch (e) { $('#main').innerHTML = `<p class="msg">Couldn't load this tab (${esc(e.message)}). Refresh to try again.</p>`; }
}
function go() {
  $('#tabs').innerHTML = TABS.map(([k, n]) => `<button role="tab" data-t="${k}" onclick="location.hash='${k}'">${n}</button>`).join('');
  const h = () => view(TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : 'matchups');
  addEventListener('hashchange', h); h();
}

/* ---------- NFL ticker (ESPN public scoreboard, refreshes every minute) ---------- */
async function tick() {
  try {
    const d = await (await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard')).json();
    const it = d.events.map(e => {
      const c = e.competitions[0].competitors, a = c.find(x => x.homeAway === 'away'), h = c.find(x => x.homeAway === 'home'), st = e.status.type;
      const side = (x, sc) => `<img class="tl" src="${esc(x.team.logo || 'https://sleepercdn.com/images/team_logos/nfl/' + x.team.abbreviation.toLowerCase() + '.png')}" alt="" onerror="this.style.display='none'">${esc(x.team.abbreviation)}${sc ? ' ' + esc(x.score) : ''}`;
      const pre = st.state === 'pre';
      return `<span class="item${st.state === 'in' ? ' live' : ''}">${side(a, !pre)} @ ${side(h, !pre)} · ${esc(st.shortDetail)}</span>`;
    }).join('');
    $('#tk').innerHTML = `<div class="set">${it}</div><div class="set" aria-hidden="true">${it}</div>`;
  } catch (e) {}
}
tick(); setInterval(tick, 60000);
init().catch(e => { $('#main').innerHTML = `<p class="msg">Couldn't reach Sleeper (${esc(e.message)}). Refresh to try again.</p>`; });
</script>
